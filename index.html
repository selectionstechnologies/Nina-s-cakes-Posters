<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Nina Cakes — custom celebration cakes, cupcakes, cheesecakes and desserts, baked to order. Order on WhatsApp: +1 469-328-6442." />
    <meta name="theme-color" content="#2e1a16" />
    <script>
      // Start downloading this route's hero image before the JS bundle runs.
      (function () {
        var heroes = { '/': 'hero-birthday', '/menu': 'hero-menu', '/about': 'hero-about', '/contact': 'hero-contact' }
        var name = heroes[location.pathname.replace(/\/+$/, '') || '/']
        if (!name) return
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.type = 'image/webp'
        l.setAttribute('fetchpriority', 'high')
        l.setAttribute('imagesrcset', [640, 1024, 1600, 2200].map(function (w) { return '/images/' + name + '-' + w + '.webp ' + w + 'w' }).join(', '))
        l.setAttribute('imagesizes', '100vw')
        document.head.appendChild(l)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Nina Cakes | Custom Cakes & Desserts</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
